---
# Deploiement cPanel (Heberjahiz). Voir DEPLOIEMENT-HEBERJAHIZ.md pour le
# detail et les raisons. Ce fichier est volontairement minimal : le parseur
# de cPanel est plus strict que celui de PyYAML, donc pas de commentaire
# dans la liste des taches, pas de substitution $(...), pas de || ni de
# tube, et surtout jamais de deux-points suivi d'une espace.
#
# php sans chemin absolu : sous CloudLinux, le PHP Selector fait pointer le
# php de l'utilisateur sur la version choisie pour le compte, ici 8.3.
#
# Jamais touche ici, parce que ca ne vient pas du depot : vendor/, .env,
# storage/ et public/build.
deployment:
  tasks:
    - export APP=/home/cleartra/cleartrack
    - export WEB=/home/cleartra/public_html
    - php -v
    - /bin/cp -Rf app bootstrap config database resources routes $APP/
    - /bin/cp -f artisan composer.json composer.lock $APP/
    - /bin/cp -Rf public $APP/
    - /bin/cp -Rf $APP/public/. $WEB/
    - /bin/sed -i "s@__DIR__\.'/\.\./@'$APP/@g" $WEB/index.php
    - php $APP/artisan migrate --force
    - php $APP/artisan db:seed --force
    - php $APP/artisan config:clear
    - php $APP/artisan config:cache
    - php $APP/artisan route:cache
    - php $APP/artisan view:cache
