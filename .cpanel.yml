---
# Deploiement cPanel (Heberjahiz). Detail et justifications dans
# DEPLOIEMENT-HEBERJAHIZ.md.
#
# NE PAS COMPLIQUER CE FICHIER. Cette forme exacte est la seule qui ait
# reellement deploye. Une version enrichie de redirections (>> et 2>&1) pour
# ecrire un journal de diagnostic a fait repondre a cPanel « The system cannot
# deploy », alors que le YAML parsait sans probleme cote PyYAML : le parseur de
# cPanel est en Perl et nettement plus strict. Donc pas de redirection, pas de
# substitution $(...), pas de || ni de tube, aucun commentaire a l'interieur de
# la liste des taches, et jamais de deux-points suivi d'une espace.
#
# /usr/local/bin/php est le chemin recommande par cPanel lui-meme sur la page
# des taches cron, et une execution reelle a confirme qu'il s'agit bien de
# PHP 8.3.33 avec pdo_mysql.
#
# Jamais touche ici, parce que ca ne vient pas du depot : vendor/, .env,
# storage/ et public/build.
deployment:
  tasks:
    - export APP=/home/cleartra/cleartrack
    - export WEB=/home/cleartra/public_html
    - /bin/cp -Rf app bootstrap config database resources routes $APP/
    - /bin/cp -f artisan composer.json composer.lock $APP/
    - /bin/cp -Rf public $APP/
    - /bin/cp -Rf $APP/public/. $WEB/
    - /bin/sed -i "s@__DIR__\.'/\.\./@'$APP/@g" $WEB/index.php
    - /usr/local/bin/php $APP/artisan migrate --force
    - /usr/local/bin/php $APP/artisan db:seed --force
    - /usr/local/bin/php $APP/artisan config:clear
    - /usr/local/bin/php $APP/artisan config:cache
    - /usr/local/bin/php $APP/artisan route:cache
    - /usr/local/bin/php $APP/artisan view:cache
